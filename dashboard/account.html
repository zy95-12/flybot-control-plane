<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlyBot · 我的空间</title><link rel="stylesheet" href="./console.css"></head>
<body><header class="topbar"><a class="brand" href="/"><span class="mark">F</span><span>flybot<small>CONTROL PLANE</small></span></a><div class="top-right"><button class="quiet" id="logout">退出登录</button></div></header><main class="wrap"><div class="notice"><b>用户空间</b><span>管理你的独立 FlyBot 实例，数据在停止后保留。</span></div><section class="card"><div class="kicker">YOUR ACCOUNT</div><h1 id="userName">载入中</h1><p id="userEmail"></p></section><section class="card"><div class="card-title"><div><h2>FlyBot 实例</h2><p>每位用户将使用独立容器和持久化数据卷。</p></div><span class="state-pill" id="instanceStatus">载入中</span></div><p id="instanceDetail">正在读取实例状态</p><div class="top-right"><button class="primary" id="createInstance" hidden>创建我的 FlyBot</button><button class="primary" id="openInstance" hidden>进入 FlyBot ↗</button><button class="quiet" id="startInstance" hidden>启动</button><button class="quiet" id="stopInstance" hidden>停止</button><button class="quiet" id="refreshInstance">刷新状态</button></div><p id="instanceError" class="form-error" role="alert"></p></section></main><script src="./account.js"></script></body></html>
